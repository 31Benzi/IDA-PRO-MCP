[project]
name = "ida-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for IDA Pro — AI-assisted reverse engineering with Claude Code"
readme = "README.md"
license = "MIT"
authors = [
    { name = "31Benzi", email = "benzifsociety@proton.me" },
]
urls = { "Homepage" = "https://github.com/31Benzi/IDA-PRO-MCP", "Repository" = "https://github.com/31Benzi/IDA-PRO-MCP" }
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "ida-pro",
    "idapython",
    "reverse-engineering",
    "claude",
    "claude-code",
    "binary-analysis",
    "hex-rays",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "mcp[cli]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ida-mcp = "ida_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ida_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
